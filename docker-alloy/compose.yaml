services:
  alloy:
    container_name: alloy
    hostname: ${HOSTNAME}
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    pid: host
    privileged: true
    restart: unless-stopped
    volumes:
      # Uncomment this if you are not using GRAFANA_ALLOY_CONFIG_BASE64
      # - ./config.alloy:/etc/alloy/config.alloy:ro

      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/nginx/:/var/log/nginx/:ro
    entrypoint: |
      sh -c '''
        # Use GRAFANA_ALLOY_CONFIG_BASE64 env if it exists
        if [ -n ${GRAFANA_ALLOY_CONFIG_BASE64} ]; then
          echo ${GRAFANA_ALLOY_CONFIG_BASE64} | base64 -d > /etc/alloy/config.alloy
        fi

        alloy run /etc/alloy/config.alloy --storage.path=/var/lib/alloy/data --server.http.listen-addr=0.0.0.0:12345
      '''
    env_file:
      - path: ./.env
        required: true
    ports:
      - "12345:12345"
      - "4319:4317"
      - "4320:4318"
